name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Build once, then promote: every push to main becomes one image, which goes
# to staging automatically and to production only after staging succeeded
# and someone approved it (Required reviewers on the `production`
# environment). Production therefore always runs an image that already ran
# on staging — migrations included, since the container runs them on start.

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sarvarlogs-app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: build
    uses: ./.github/workflows/deploy-to.yml
    permissions:
      packages: read
    with:
      environment: staging
      image_tag: ${{ github.sha }}
    secrets: inherit

  # Waits for approval in the Actions tab when `production` has Required
  # reviewers set — the point of staging is to look before this runs.
  deploy-production:
    needs: [build, deploy-staging]
    uses: ./.github/workflows/deploy-to.yml
    permissions:
      packages: read
    with:
      environment: production
      image_tag: ${{ github.sha }}
    secrets: inherit
