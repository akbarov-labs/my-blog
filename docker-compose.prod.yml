# Production stack for the Contabo server. One container: PHP-FPM + nginx
# together (see docker/prod/Dockerfile), using SQLite so there's no separate
# database process.
#
# Public routing: joins the standalone `edge` Caddy (caddy-docker-proxy) via
# Docker labels — see ~/edge on the server / infra/edge-caddy/ in
# online-shop-telegram-bot. No shared Caddyfile for any project to own, and
# no dependency on kitoblarim's own network either.
#
# This file is copied to the server by the deploy workflow; the real .env
# next to it on the server is created once by hand (see DEPLOY.md) and is
# never touched by deploys.

services:
  app:
    image: ${IMAGE:-ghcr.io/akbarov-labs/sarvarlogs-app}:${IMAGE_TAG:-latest}
    container_name: my-blog-app
    restart: unless-stopped
    env_file: .env
    volumes:
      - app_storage:/var/www/html/storage
    mem_limit: 256m
    networks:
      - edge
    labels:
      caddy: ${DOMAIN:?set DOMAIN in .env, e.g. sarvarlogs.uz}
      caddy.reverse_proxy: "{{upstreams 80}}"

networks:
  edge:
    external: true

volumes:
  app_storage:
